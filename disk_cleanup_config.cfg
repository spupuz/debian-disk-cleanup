# Disk Cleanup Configuration File
# Edit these values to customize the cleanup behavior

# Telegram configuration
TELEGRAM_BOT_TOKEN="YOUR_TELEGRAM_BOT_TOKEN_HERE"
TELEGRAM_CHAT_ID="YOUR_TELEGRAM_CHAT_ID_HERE"

# Cleanup options (true/false)
CLEAN_DOCKER_PRUNE=true
CLEAN_CONTAINERD_SNAPSHOTS=true
CLEAN_APT_CACHE=true
CLEAN_JOURNAL=true
# NOTE: Whisper cleanup REMOVED - path /path/to/arrmada/data/whisper was incorrect
# arrmada data is on ZFS in /zfsfiles/DockerConfig/arcanearr/projects/arrmada/data/arrmada/
# Do not delete arbitrary paths on / without verifying they belong to the application

# Space thresholds (in GB - cleanup only if free space below this)
MIN_FREE_GB=5

# Which paths to check for orphaned data (only safe, verified paths)
# Add any additional safe paths here if needed
WHISPER_PATHS=()

# Docker cleanup options
PRUNE_IMAGES=true
PRUNE_VOLUMES=true
PRUNE_NETWORKS=false

# Journal vacuum size (in MB, 0 to skip)
JOURNAL_VACUUM_SIZE=100

# Logging
LOG_TO_FILE=true
LOG_FILE="/var/log/disk_cleanup.log"